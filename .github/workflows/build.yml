# Build, test and package Krate (packaging/README.md#releases).
#
# Every push to main and every pull request: a release build on Debian 13
# (Qt 6.8, which the project needs), every test, and the .deb as an
# artifact of the run. A tag v<version> does the same and publishes a
# GitHub Release with the .deb, versioned from the tag.
name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    container: debian:trixie
    steps:
      - name: Install build dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            ca-certificates git build-essential cmake ninja-build pkg-config file dpkg-dev \
            qt6-base-dev qt6-base-dev-tools qt6-declarative-dev qt6-declarative-dev-tools \
            libjack-jackd2-dev zlib1g-dev libx11-dev \
            qml6-module-qtqml qml6-module-qtqml-models qml6-module-qtqml-workerscript \
            qml6-module-qtquick qml6-module-qtquick-controls qml6-module-qtquick-dialogs \
            qml6-module-qtquick-layouts qml6-module-qtquick-shapes qml6-module-qtquick-templates \
            qml6-module-qtquick-window qt6-qpa-plugins libqt6sql6-sqlite

      - uses: actions/checkout@v4

      - name: Version
        id: version
        shell: bash
        run: |
          # One number everywhere: CMakeLists.txt's (the app shows it, the
          # package carries it, the updater compares it); a release tag must
          # be that number (packaging/release.sh makes both).
          project=$(sed -n 's/^project(krate VERSION \([0-9.]*\).*/\1/p' CMakeLists.txt)
          if [[ "$GITHUB_REF" == refs/tags/v* && "${GITHUB_REF_NAME#v}" != "$project" ]]; then
            echo "::error::tag $GITHUB_REF_NAME doesn't match CMakeLists.txt's version $project"
            exit 1
          fi
          echo "package=$project" >> "$GITHUB_OUTPUT"

      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=/usr -DKRATE_PACKAGE_VERSION=${{ steps.version.outputs.package }}

      - name: Build
        run: cmake --build build

      - name: Test
        env:
          QT_QPA_PLATFORM: offscreen
        run: ctest --test-dir build --output-on-failure -j"$(nproc)"

      - name: Package
        run: |
          cpack --config build/CPackConfig.cmake -B dist
          rm -rf dist/_CPack_Packages
          dpkg-deb --info dist/*.deb

      - uses: actions/upload-artifact@v4
        with:
          name: krate-deb
          path: dist/*.deb
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: krate-deb
          path: dist
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # The updater checks the package against this (docs/UPDATES.md).
          (cd dist && sha256sum *.deb > SHA256SUMS)
          gh release create "$GITHUB_REF_NAME" dist/*.deb dist/SHA256SUMS \
            --repo "$GITHUB_REPOSITORY" \
            --title "Krate ${GITHUB_REF_NAME#v}" \
            --generate-notes
